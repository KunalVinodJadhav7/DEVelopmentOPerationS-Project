services:
  db:
    image: postgres:16-alpine
    container_name: leaveflow-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-leave_approval_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-leave_approval_db}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

    volumes:
      - leaveflow_db:/var/lib/postgresql/data


  app:
    build:
      context: .
      dockerfile: Dockerfile

    image: leave-approval-system:latest
    container_name: leaveflow-app
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-leave_approval_db}"
      UPLOAD_DIR: /app/uploads

    secrets:
      - source: leaveflow_secret_key
        target: /run/secrets/leaveflow_secret_key

    expose:
      - "8000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=3)"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    volumes:
      - leaveflow_uploads:/app/uploads


  nginx:
    image: nginx:1.27-alpine
    container_name: leaveflow-nginx
    restart: unless-stopped

    depends_on:
      app:
        condition: service_healthy

    ports:
      - "8000:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro


volumes:
  leaveflow_db:
  leaveflow_uploads:


secrets:
  leaveflow_secret_key:
    environment: SECRET_KEY
