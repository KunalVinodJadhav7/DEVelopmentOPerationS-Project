services:
  db:
    build:
      context: .
      dockerfile: docker/postgres.Dockerfile
    image: leaveflow-postgres:16-alpine-locales
    container_name: leaveflow-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-leave_approval_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

    volumes:
      - leaveflow_db:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-leave_approval_db}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${LEAVEFLOW_APP_VERSION:-dev}

    image: ${LEAVEFLOW_APP_IMAGE:-leave-approval-system:latest}
    container_name: leaveflow-app
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-leave_approval_db}"
      UPLOAD_DIR: /app/uploads

    secrets:
      - leaveflow_secret_key

    volumes:
      - leaveflow_uploads:/app/uploads

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=3).read()"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    container_name: leaveflow-nginx
    restart: unless-stopped

    depends_on:
      app:
        condition: service_healthy

    ports:
      - "8000:80"

    # Use the static Nginx configuration directly.
    # This bypasses the official image startup script that attempts
    # to modify default.conf.
    entrypoint:
      - nginx
      - -g
      - daemon off;

    volumes:
      - "${LEAVEFLOW_DOCKER_HOST_APP_DIR:-.}/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"

volumes:
  leaveflow_db:
  leaveflow_uploads:

secrets:
  leaveflow_secret_key:
    file: "${LEAVEFLOW_DOCKER_HOST_APP_DIR:-.}/secrets/leaveflow_secret_key.txt"
