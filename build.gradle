plugins {
    id 'base'
}

group = 'com.leaveflow'
version = project.findProperty('appVersion') ?: '1.0.0'

tasks.register('packageApp', Zip) {
    group = 'distribution'
    description = 'Packages the Employee Leave Approval System.'

    archiveBaseName.set('employee-leave-approval-system')
    archiveVersion.set(project.version.toString())
    destinationDirectory.set(layout.buildDirectory.dir('dist'))

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from(projectDir) {
        // Git
        exclude '.git/**'
        exclude '.gitignore'

        // Gradle
        exclude '.gradle/**'

        // Python virtual environments
        exclude '.venv/**'
        exclude '.ci-venv/**'

        // Build/test generated files
        exclude 'build/**'
        exclude '__pycache__/**'
        exclude '**/__pycache__/**'
        exclude '*.pyc'
        exclude '**/*.pyc'
        exclude '*.pyo'
        exclude '**/*.pyo'
        exclude 'test-results/**'

        // Secrets/configuration
        exclude '.env'
        exclude '.env.*'

        // Databases
        exclude '*.db'
        exclude '**/*.db'
        exclude '*.sqlite'
        exclude '**/*.sqlite'
        exclude '*.sqlite3'
        exclude '**/*.sqlite3'

        // Runtime uploads
        exclude 'uploads/**'
        exclude '**/uploads/**'
    }
}

tasks.named('build') {
    dependsOn(tasks.named('packageApp'))
}
