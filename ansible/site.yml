---
- name: Configure and deploy Employee Leave Approval System
  hosts: app
  gather_facts: true
  become: false

  vars:
    # WSL/Docker Desktop-friendly default.
    # For a remote Linux host, override with:
    # -e app_dir=/opt/leave-approval-system
    app_dir: "{{ lookup('env', 'LEAVEFLOW_ANSIBLE_APP_DIR') | default(lookup('env', 'HOME') ~ '/leave-approval-system', true) }}"
    # Jenkins passes the stable project name for its custom workspace.
    # Standalone Linux executions retain the documented 'leaveflow' default.
    compose_project_name: "{{ lookup('env', 'LEAVEFLOW_COMPOSE_PROJECT') | default('leaveflow', true) }}"
    compose_file_name: "{{ lookup('env', 'LEAVEFLOW_COMPOSE_FILE') | default('docker-compose.yml', true) }}"

    release_version: "{{ lookup('env', 'LEAVEFLOW_APP_VERSION') | default(lookup('env', 'BUILD_NUMBER') | default('local', true), true) }}"

    app_port: 8000

    # Docker-based Jenkins Ansible runner reaches the application through
    # Docker Desktop's host gateway. Native Linux targets use loopback.
    health_host: "{{ lookup('env', 'LEAVEFLOW_ANSIBLE_HEALTH_HOST') | default('127.0.0.1', true) }}"
    # In the Jenkins Docker Desktop runner, this path is the shared workspace
    # mounted again at the daemon-visible Linux VM path so Compose can stat
    # bind sources in the same path namespace used by Docker Engine.
    docker_host_app_dir: "{{ lookup('env', 'LEAVEFLOW_DOCKER_HOST_APP_DIR') | default('', true) }}"

    configuration_spec:
      logical_prerequisites:
        - Python 3
        - Docker Engine
        - Docker CLI
        - Docker Compose v2
      users:
        - Ansible execution account with Docker engine access
      managed_directories:
        - "{{ app_dir }}"
        - "{{ app_dir }}/uploads"
      managed_files:
        - "{{ app_dir }}/Dockerfile"
        - "{{ app_dir }}/docker-compose.yml"
        - "{{ app_dir }}/requirements.txt"
        - "{{ app_dir }}/.env.example"
        - "{{ app_dir }}/RELEASE"
      service: Docker Engine / Docker Desktop Linux engine
      ports:
        - 8000
        - 5432

    # Resolve Docker from the Ansible runner's shell once.
    # Ansible's module PATH can be more restrictive than the runner's shell PATH.
    docker_cli: "{{ lookup('ansible.builtin.pipe', 'command -v docker') | trim }}"

  pre_tasks:
    - name: Verify Linux target
      ansible.builtin.assert:
        that:
          - ansible_facts.system == 'Linux'
        fail_msg: >-
          Week 14 Ansible playbook expects a Linux target. Run it from Ubuntu/WSL
          or use a Linux remote host; do not run Linux tasks directly on Windows.
        success_msg: >-
          Linux target confirmed: {{ ansible_facts.distribution }}
          {{ ansible_facts.distribution_version }}

    - name: Verify Docker CLI path was resolved
      ansible.builtin.assert:
        that:
          - docker_cli | length > 0
        fail_msg: >-
          Docker CLI could not be resolved from the WSL shell PATH.
          Confirm Docker Desktop WSL integration is enabled and that
          `command -v docker` works in this WSL session.
        success_msg: "Docker CLI resolved at {{ docker_cli }}"

    - name: Verify Docker CLI
      ansible.builtin.command:
        argv:
          - "{{ docker_cli }}"
          - --version
      register: docker_version
      changed_when: false
      check_mode: false

    - name: Verify Docker Compose v2
      ansible.builtin.command:
        argv:
          - "{{ docker_cli }}"
          - compose
          - version
      register: compose_version
      changed_when: false
      check_mode: false

  tasks:
    - name: Display Week 14 configuration specification
      ansible.builtin.debug:
        msg:
          prerequisites: "{{ configuration_spec.logical_prerequisites }}"
          users: "{{ configuration_spec.users }}"
          managed_directories: "{{ configuration_spec.managed_directories }}"
          managed_files: "{{ configuration_spec.managed_files }}"
          service: "{{ configuration_spec.service }}"
          ports: "{{ configuration_spec.ports }}"

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        mode: '0755'

    - name: Create uploads directory
      ansible.builtin.file:
        path: "{{ app_dir }}/uploads"
        state: directory
        mode: '0755'

    - name: Verify Jenkins runtime secret for the environment-backed Compose secret
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.env', 'LEAVEFLOW_SECRET_KEY') | length >= 32
        fail_msg: >-
          Jenkins credential 'leaveflow-secret-key' is missing or shorter than
          32 characters. Set a strong random value of at least 32 bytes in Jenkins
          Credentials. The value is never printed.
        success_msg: Jenkins runtime secret is present and meets the minimum length.

    - name: Copy Dockerfile
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../Dockerfile"
        dest: "{{ app_dir }}/Dockerfile"
        mode: '0644'

    - name: Copy Docker Compose definition
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../{{ compose_file_name }}"
        dest: "{{ app_dir }}/{{ compose_file_name }}"
        mode: '0644'

    - name: Copy Docker build metadata files
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../{{ item }}"
        dest: "{{ app_dir }}/{{ item }}"
        mode: '0644'
      loop:
        - requirements.txt
        - README.md
        - IMPLEMENTATION_STEPS.md
        - .env.example

    - name: Merge application source directories safely on the shared workspace mount
      ansible.builtin.shell:
        cmd: |
          set -eu
          src={{ (playbook_dir ~ '/../' ~ item) | quote }}
          dest={{ (app_dir ~ '/' ~ item) | quote }}

          if [ ! -d "$src" ]; then
            echo "ERROR: source directory is missing: $src" >&2
            exit 1
          fi

          # Treat destination root conflicts explicitly; never replace a file or
          # symlink with a directory. Existing destination-only files are kept.
          if [ -L "$dest" ] || { [ -e "$dest" ] && [ ! -d "$dest" ]; }; then
            echo "ERROR: destination exists but is not a real directory: $dest" >&2
            ls -ld -- "$dest" >&2 || true
            exit 1
          fi

          # Only create the root when missing. Windows bind mounts can report
          # EEXIST/ENOENT for redundant mkdir operations during production runs.
          if [ ! -d "$dest" ]; then
            mkdir -p -- "$dest"
          fi

          # Merge at file level rather than invoking cp on the entire tree.
          # The production destination may already contain files from an older
          # deployment; bulk cp can fail with EEXIST on Docker Desktop mounts.
          MERGE_SRC="$src" MERGE_DEST="$dest" python3 - <<'PYMERGE'
          import filecmp
          import os
          import shutil
          import sys
          from pathlib import Path
          
          src = Path(os.environ["MERGE_SRC"])
          dest = Path(os.environ["MERGE_DEST"])
          
          def fail(message):
              print(f"ERROR: {message}", file=sys.stderr)
              raise SystemExit(1)
          
          if not src.is_dir():
              fail(f"source directory is missing: {src}")
          if dest.is_symlink() or (dest.exists() and not dest.is_dir()):
              fail(f"destination exists but is not a real directory: {dest}")
          if not dest.is_dir():
              dest.mkdir(parents=True, exist_ok=True)
          
          changed = False
          for root, dirnames, filenames in os.walk(src, topdown=True, followlinks=False):
              source_dir = Path(root)
              relative_dir = source_dir.relative_to(src)
              target_dir = dest / relative_dir
          
              if target_dir.is_symlink() or (target_dir.exists() and not target_dir.is_dir()):
                  fail(f"destination path conflicts with source directory: {target_dir}")
              if not target_dir.is_dir():
                  target_dir.mkdir(parents=True, exist_ok=True)
                  changed = True
          
              # Preserve source symlinks without traversing them. A mismatching
              # existing target is a conflict; do not replace it silently.
              for name in list(dirnames):
                  source_path = source_dir / name
                  if source_path.is_symlink():
                      dirnames.remove(name)
                      target_path = target_dir / name
                      link_value = os.readlink(source_path)
                      if target_path.is_symlink() and os.readlink(target_path) == link_value:
                          continue
                      if target_path.exists() or target_path.is_symlink():
                          fail(f"symlink destination conflict: {target_path}")
                      os.symlink(link_value, target_path)
                      changed = True
          
              for name in filenames:
                  source_path = source_dir / name
                  target_path = target_dir / name
          
                  if source_path.is_symlink():
                      link_value = os.readlink(source_path)
                      if target_path.is_symlink() and os.readlink(target_path) == link_value:
                          continue
                      if target_path.exists() or target_path.is_symlink():
                          fail(f"symlink destination conflict: {target_path}")
                      os.symlink(link_value, target_path)
                      changed = True
                      continue
          
                  if not source_path.is_file():
                      continue
                  if target_path.is_symlink() or (target_path.exists() and not target_path.is_file()):
                      fail(f"file destination conflict: {target_path}")
          
                  if target_path.is_file() and filecmp.cmp(source_path, target_path, shallow=False):
                      continue
          
                  # shutil.copy2 opens an existing regular file for writing,
                  # unlike the bulk cp behavior that failed with EEXIST here.
                  shutil.copy2(source_path, target_path)
                  changed = True
          
          if changed:
              print(f"CHANGED: merged source directory {src} into {dest}")
          else:
              print(f"OK: source directory already matches destination: {dest}")
          PYMERGE
        executable: /bin/sh
      loop:
        - app
        - frontend
        - templates
        - sql
        - nginx
        - docker
      register: source_directory_merge
      changed_when: "'CHANGED:' in source_directory_merge.stdout"

    - name: Write release marker
      ansible.builtin.copy:
        dest: "{{ app_dir }}/RELEASE"
        content: "{{ release_version }}\n"
        mode: '0644'

    - name: Validate application directory
      ansible.builtin.stat:
        path: "{{ app_dir }}"
      register: app_dir_state
      changed_when: false

    - name: Inspect fixed-name Compose containers
      when: not ansible_check_mode
      community.docker.docker_container_info:
        name: "{{ item }}"
      loop:
        - leaveflow-db
        - leaveflow-app
        - leaveflow-nginx
      register: fixed_name_containers

    - name: Remove fixed-name containers owned by another Compose project
      when:
        - not ansible_check_mode
        - item.exists | default(false)
        - >-
          ((item.container.Config.Labels | default({})).get('com.docker.compose.project', ''))
          != compose_project_name
      community.docker.docker_container:
        name: "{{ item.item }}"
        state: absent
        force_kill: true
      loop: "{{ fixed_name_containers.results | default([]) }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Deploy the Compose application with startup diagnostics
      when: not ansible_check_mode
      block:
        - name: Deploy the Compose application
          community.docker.docker_compose_v2:
            docker_cli: "{{ docker_cli }}"
            project_src: "{{ app_dir }}"
            project_name: "{{ compose_project_name }}"
            state: present
            pull: missing
            build: policy
          # The environment-backed Compose secret is read from the Ansible
          # runner's process environment. Do not write its value to a file or log.
          environment:
            LEAVEFLOW_APP_IMAGE: "leave-approval-system:{{ release_version }}"
            LEAVEFLOW_APP_VERSION: "{{ release_version }}"
            LEAVEFLOW_DOCKER_HOST_APP_DIR: "{{ docker_host_app_dir }}"
            LEAVEFLOW_SECRET_KEY: "{{ lookup('ansible.builtin.env', 'LEAVEFLOW_SECRET_KEY') }}"
          no_log: true
      rescue:
        - name: Capture application logs after Compose deployment failure
          ansible.builtin.command:
            argv:
              - "{{ docker_cli }}"
              - logs
              - --tail
              - "100"
              - leaveflow-app
          register: app_startup_logs
          changed_when: false
          failed_when: false

        - name: Capture application container state after Compose deployment failure
          community.docker.docker_container_info:
            name: leaveflow-app
          register: app_startup_info
          failed_when: false

        - name: Display application startup diagnostics
          ansible.builtin.debug:
            msg:
              state: "{{ (app_startup_info.container | default({})).get('State', {}).get('Status', 'unavailable') }}"
              exit_code: "{{ (app_startup_info.container | default({})).get('State', {}).get('ExitCode', 'unknown') }}"
              container_error: "{{ (app_startup_info.container | default({})).get('State', {}).get('Error', '') }}"
              logs: "{{ app_startup_logs.stdout | default('No stdout from docker logs.') }}"
              log_stderr: "{{ app_startup_logs.stderr | default('') }}"

        - name: Fail after displaying application startup diagnostics
          ansible.builtin.fail:
            msg: >-
              Compose deployment failed. Review the application startup diagnostics
              printed above; the original Compose failure was
              {{ ansible_failed_result.msg | default('not available') }}.

    - name: Verify Compose application status
      when: not ansible_check_mode
      ansible.builtin.command:
        argv:
          - "{{ docker_cli }}"
          - compose
          - -p
          - "{{ compose_project_name }}"
          - -f
          - "{{ app_dir }}/{{ compose_file_name }}"
          - ps
      register: compose_ps
      changed_when: false
      check_mode: false

    - name: Wait for application health
      when: not ansible_check_mode
      ansible.builtin.uri:
        url: "http://{{ health_host }}:{{ app_port }}/health"
        method: GET
        status_code: 200
        return_content: true
      register: health_response
      retries: 10
      delay: 3
      until: health_response.status == 200

    - name: Inspect deployed Compose containers
      when: not ansible_check_mode
      community.docker.docker_container_info:
        name: "{{ item }}"
      loop:
        - leaveflow-db
        - leaveflow-app
        - leaveflow-nginx
      register: deployed_containers
      changed_when: false

    - name: Verify application and database containers are healthy
      when:
        - not ansible_check_mode
        - item.item in ['leaveflow-app', 'leaveflow-db']
      ansible.builtin.assert:
        that:
          - item.exists | default(false)
          - (item.container | default({})).get('State', {}).get('Status', 'missing') == 'running'
          - (item.container | default({})).get('State', {}).get('Health', {}).get('Status', 'missing') == 'healthy'
        fail_msg: "{{ item.item }} is missing, stopped, or unhealthy."
        success_msg: "{{ item.item }} is running and healthy."
      loop: "{{ deployed_containers.results | default([]) }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Verify Nginx container is running
      when:
        - not ansible_check_mode
        - item.item == 'leaveflow-nginx'
      ansible.builtin.assert:
        that:
          - item.exists | default(false)
          - (item.container | default({})).get('State', {}).get('Status', 'missing') == 'running'
        fail_msg: "{{ item.item }} is missing or stopped."
        success_msg: "{{ item.item }} is running."
      loop: "{{ deployed_containers.results | default([]) }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Verify the running application uses the requested release image
      when:
        - not ansible_check_mode
        - item.item == 'leaveflow-app'
      ansible.builtin.assert:
        that:
          - item.exists | default(false)
          - (item.container | default({})).get('Config', {}).get('Image', '') == ('leave-approval-system:' ~ release_version)
        fail_msg: >-
          leaveflow-app is not running the requested release image.
          Expected leave-approval-system:{{ release_version }}; actual
          {{ (item.container | default({})).get('Config', {}).get('Image', 'missing') }}.
        success_msg: "leaveflow-app is running leave-approval-system:{{ release_version }}."
      loop: "{{ deployed_containers.results | default([]) }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Confirm PostgreSQL-backed health response
      when: not ansible_check_mode
      ansible.builtin.assert:
        that:
          - health_response.json.status == 'ok'
          - health_response.json.database == 'postgresql'
        fail_msg: >-
          Application health endpoint did not confirm the expected
          PostgreSQL-backed state.
          Response: {{ health_response.content | default('no response', true) }}
        success_msg: FastAPI health check confirms PostgreSQL connectivity.

    - name: Inspect deployed release image ID
      when: not ansible_check_mode
      ansible.builtin.command:
        argv:
          - "{{ docker_cli }}"
          - image
          - inspect
          - "--format={{ '{{.Id}}' }}"
          - "leave-approval-system:{{ release_version }}"
      register: release_image_id
      changed_when: false
      check_mode: false

    - name: Inspect latest image ID when present
      when: not ansible_check_mode
      ansible.builtin.command:
        argv:
          - "{{ docker_cli }}"
          - image
          - inspect
          - "--format={{ '{{.Id}}' }}"
          - leave-approval-system:latest
      register: latest_image_id
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Point latest tag at the verified release image
      when:
        - not ansible_check_mode
        - latest_image_id.rc != 0 or (latest_image_id.stdout | trim) != (release_image_id.stdout | trim)
      ansible.builtin.command:
        argv:
          - "{{ docker_cli }}"
          - image
          - tag
          - "leave-approval-system:{{ release_version }}"
          - leave-approval-system:latest
      changed_when: true

    - name: Report check-mode limitation
      when: ansible_check_mode
      ansible.builtin.debug:
        msg: >-
          Check mode completed without live Compose deployment or HTTP health
          verification. Run the playbook without --check for the actual Docker
          deployment and runtime health checks.

    - name: Find obsolete file-backed Compose secret copies from previous runs
      ansible.builtin.find:
        paths: "{{ app_dir }}/secrets"
        patterns:
          - "leaveflow_secret_key.txt"
          - "leaveflow_secret_key.txt.conflict-backup-*"
        file_type: any
        recurse: false
      register: obsolete_runtime_secret_files
      failed_when: false
      when: not ansible_check_mode

    - name: Remove obsolete file-backed Compose secret copies
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ obsolete_runtime_secret_files.files | default([]) }}"
      loop_control:
        label: "obsolete runtime secret copy"
      when: not ansible_check_mode
      no_log: true

    - name: Remove obsolete secret directory if it is empty
      ansible.builtin.command:
        argv:
          - rmdir
          - "{{ app_dir }}/secrets"
      register: obsolete_secret_dir_cleanup
      failed_when: false
      changed_when: obsolete_secret_dir_cleanup.rc == 0
      when: not ansible_check_mode

    - name: Display final Ansible deployment summary
      ansible.builtin.debug:
        msg:
          - "Release: {{ release_version }}"
          - "Application directory: {{ app_dir }}"
          - "Docker: {{ docker_version.stdout }}"
          - "Compose: {{ compose_version.stdout }}"
          - "Compose project: {{ compose_project_name }}"
          - "Health endpoint: http://{{ health_host }}:{{ app_port }}/health"
          - "Application directory exists: {{ app_dir_state.stat.exists }}"
          - "Ansible live execution: completed"
